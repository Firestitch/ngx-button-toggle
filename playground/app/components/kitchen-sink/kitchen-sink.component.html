<fs-label-field>
  <fs-label>Repeat On</fs-label>
  <mat-button-toggle-group
    name="weekdays"
    class="weekdays"
    [(ngModel)]="weekdays">
    @for (weekday of weekdaysList; track weekday) {
      <mat-button-toggle class="weekday" [value]="weekday">
        {{weekday}}
      </mat-button-toggle>
    }
  </mat-button-toggle-group>
</fs-label-field>
